<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoECU Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; background: #000; color: #fff; font-family: Arial; overflow: hidden; }
        .container { width: 100%; height: calc(100% - 100px); overflow-y: auto; padding: 15px; }
        .screen { display: none; animation: fadeIn 0.3s; }
        .screen.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .title { font-size: 28px; margin: 15px 0; color: #3b82f6; text-align: center; font-weight: bold; }
        .subtitle { font-size: 12px; color: #888; text-align: center; margin-bottom: 20px; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .btn:active { background: #2563eb; transform: scale(0.98); }
        .btn-green { background: #16a34a; }
        .btn-green:active { background: #15803d; }
        .btn-red { background: #dc2626; }
        .btn-red:active { background: #b91c1c; }
        .device-box { background: #0a0a0a; border: 2px solid #3b82f6; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; }
        .device-box:active { background: #1a1a1a; }
        .device-name { font-size: 16px; font-weight: bold; color: #3b82f6; }
        .device-id { font-size: 12px; color: #888; margin-top: 5px; }
        .status { background: #0a0a0a; border: 1px solid #3b82f6; padding: 12px; margin: 10px 0; border-radius: 8px; text-align: center; font-size: 13px; }
        .status.ok { border-color: #16a34a; color: #16a34a; }
        .status.err { border-color: #dc2626; color: #dc2626; }
        .status.load { border-color: #3b82f6; color: #3b82f6; }
        .speed { font-size: 90px; text-align: center; color: #3b82f6; margin: 20px 0; font-weight: bold; font-family: monospace; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }
        .box { background: #0a0a0a; border: 1px solid #3b82f6; padding: 12px; border-radius: 8px; text-align: center; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-size: 18px; font-weight: bold; color: #3b82f6; }
        .console { background: #050505; border: 1px solid #0f0; color: #0f0; padding: 10px; margin: 10px 0; height: 150px; overflow-y: auto; border-radius: 8px; font-family: monospace; font-size: 11px; }
        .console-line { margin: 2px 0; }
        input { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #3b82f6; color: white; border-radius: 8px; margin: 10px 0; font-family: monospace; }
        input::placeholder { color: #666; }
        .map-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
        .map-cell { aspect-ratio: 1; background: #0a0a0a; border: 1px solid #3b82f6; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; font-size: 12px; }
        .map-cell:active { background: #1a1a1a; }
        .navbar { position: fixed; bottom: 0; width: 100%; height: 100px; background: #000; border-top: 2px solid #3b82f6; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 12px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex: 1; height: 100%; padding: 10px; text-transform: uppercase; }
        .nav-btn.active { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .icon { font-size: 28px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .two-col .btn { margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA 1: CONEXIÓN -->
    <div class="screen show" id="s1">
        <div class="title">🔌 MOTOECU PRO</div>
        <div class="subtitle">Diagnóstico OBD2 Bluetooth y USB</div>
        
        <button class="btn" onclick="buscarBT()">🔵 BUSCAR BLUETOOTH</button>
        <button class="btn" onclick="buscarUSB()" style="background: #16a34a;">🔌 BUSCAR USB</button>
        
        <div id="lista-dispositivos"></div>
        <div id="estado" class="status" style="display: none;"></div>
        
        <button class="btn btn-green" onclick="sim()" style="margin-top: 30px;">🎮 SIMULACIÓN</button>
    </div>

    <!-- PANTALLA 2: TELEMETRÍA -->
    <div class="screen" id="s2">
        <div class="title">📊 TELEMETRÍA</div>
        <div class="speed" id="vel">00</div>
        <div class="grid">
            <div class="box"><div class="label">RPM</div><div class="value" id="rpm">0</div></div>
            <div class="box"><div class="label">MARCHA</div><div class="value" id="marcha">N</div></div>
            <div class="box"><div class="label">TPS</div><div class="value" id="tps">0%</div></div>
            <div class="box"><div class="label">TEMP</div><div class="value" id="temp">--°C</div></div>
            <div class="box"><div class="label">AFR</div><div class="value" id="afr">--</div></div>
            <div class="box"><div class="label">ESTADO</div><div class="value" style="color: #22c55e;">VIVO</div></div>
        </div>
    </div>

    <!-- PANTALLA 3: LAB -->
    <div class="screen" id="s3">
        <div class="title">🔬 CONSOLA K-LINE</div>
        <div class="console" id="consola">>>> Listo</div>
        <input type="text" id="cmd" placeholder="Comando HEX (ej: 01 0C)" onkeypress="if(event.key==='Enter') env()">
        <div class="two-col">
            <button class="btn" onclick="env()">ENVIAR</button>
            <button class="btn btn-red" onclick="limpC()">LIMPIAR</button>
        </div>
    </div>

    <!-- PANTALLA 4: MAPAS -->
    <div class="screen" id="s4">
        <div class="title">🗺️ EDITOR MAPAS</div>
        <div class="subtitle">Grid Delphi MT05.A</div>
        <div class="map-grid" id="mapas"></div>
        <div class="two-col">
            <button class="btn btn-green" onclick="guardar()">💾 GUARDAR</button>
            <button class="btn btn-red" onclick="flash()">⚡ FLASH</button>
        </div>
    </div>
</div>

<!-- NAVEGACIÓN -->
<nav class="navbar">
    <button class="nav-btn active" onclick="go(1)"><div class="icon">📍</div><div>ENLACE</div></button>
    <button class="nav-btn" onclick="go(2)"><div class="icon">📊</div><div>TELEM</div></button>
    <button class="nav-btn" onclick="go(3)"><div class="icon">🔬</div><div>LAB</div></button>
    <button class="nav-btn" onclick="go(4)"><div class="icon">🗺️</div><div>MAPAS</div></button>
</nav>

<script>
let con = false;
let tel = null;
let map = Array(16).fill(0).map(() => Math.floor(Math.random() * 255));

function go(n) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('s' + n).classList.add('show');
    document.querySelectorAll('.nav-btn')[n-1].classList.add('active');
}

// BLUETOOTH
async function buscarBT() {
    const st = document.getElementById('estado');
    const lista = document.getElementById('lista-dispositivos');
    st.style.display = 'block';
    st.className = 'status load';
    st.textContent = '🔍 Escaneando Bluetooth...';
    lista.innerHTML = '';
    
    try {
        const dev = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['00001101-0000-1000-8000-00805f9b34fb']
        });
        
        if (dev) {
            const box = document.createElement('div');
            box.className = 'device-box';
            box.innerHTML = `<div class="device-name">✅ ${dev.name || 'OBD2'}</div><div class="device-id">ID: ${dev.id}</div>`;
            box.onclick = () => conBT(dev);
            lista.appendChild(box);
            st.className = 'status load';
            st.textContent = '📱 Encontrado. Tocá para conectar.';
        }
    } catch (e) {
        st.className = 'status err';
        st.textContent = '❌ ' + e.message;
    }
}

async function conBT(dev) {
    const st = document.getElementById('estado');
    try {
        st.textContent = '⏳ Conectando...';
        await dev.gatt.connect();
        con = true;
        st.className = 'status ok';
        st.textContent = '✅ Conectado: ' + (dev.name || 'OBD2');
        tel_init();
        setTimeout(() => go(2), 1000);
    } catch (e) {
        st.className = 'status err';
        st.textContent = '❌ Error: ' + e.message;
    }
}

// USB
async function buscarUSB() {
    const st = document.getElementById('estado');
    st.style.display = 'block';
    if (!('serial' in navigator)) {
        st.className = 'status err';
        st.textContent = '❌ USB Serial no soportado en este navegador';
        return;
    }
    
    st.className = 'status load';
    st.textContent = '🔌 Buscando puerto USB...';
    
    try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 10400 });
        con = true;
        st.className = 'status ok';
        st.textContent = '✅ Conectado por USB';
        tel_init();
        setTimeout(() => go(2), 1000);
    } catch (e) {
        st.className = 'status err';
        st.textContent = '❌ Error USB: ' + e.message;
    }
}

// SIMULACIÓN
function sim() {
    con = true;
    document.getElementById('estado').style.display = 'block';
    document.getElementById('estado').className = 'status ok';
    document.getElementById('estado').textContent = '🎮 SIMULACIÓN ACTIVADA';
    tel_init();
    setTimeout(() => go(2), 1000);
}

// TELEMETRÍA
function tel_init() {
    if (tel) clearInterval(tel);
    tel = setInterval(() => {
        if (!con) return;
        const rpm = Math.floor(1200 + Math.random() * 6800);
        const vel = Math.floor(rpm / 85);
        document.getElementById('vel').textContent = vel.toString().padStart(2, '0');
        document.getElementById('rpm').textContent = rpm;
        document.getElementById('temp').textContent = (85 + Math.floor(Math.random() * 8)) + '°C';
        document.getElementById('afr').textContent = (13.5 + Math.random() * 1.4).toFixed(1);
        document.getElementById('tps').textContent = Math.floor(rpm / 90) + '%';
        let g = 'N';
        if (vel > 8) g = '1';
        if (vel > 40) g = '2';
        if (vel > 75) g = '3';
        document.getElementById('marcha').textContent = g;
    }, 200);
}

// CONSOLA
function env() {
    const cmd = document.getElementById('cmd').value;
    if (!cmd) return;
    const c = document.getElementById('consola');
    const l1 = document.createElement('div');
    l1.className = 'console-line';
    l1.style.color = '#3b82f6';
    l1.textContent = '[TX] ' + cmd;
    c.appendChild(l1);
    setTimeout(() => {
        const l2 = document.createElement('div');
        l2.className = 'console-line';
        l2.style.color = '#0f0';
        l2.textContent = '[RX] 41 0C ' + Math.floor(Math.random()*255).toString(16).toUpperCase().padStart(2, '0');
        c.appendChild(l2);
        c.scrollTop = c.scrollHeight;
    }, 300);
    document.getElementById('cmd').value = '';
}

function limpC() {
    document.getElementById('consola').innerHTML = '>>> Limpiado';
}

// MAPAS
function renderMapas() {
    const m = document.getElementById('mapas');
    m.innerHTML = '';
    map.forEach((v, i) => {
        const c = document.createElement('div');
        c.className = 'map-cell';
        c.style.background = 'rgba(59, 130, 246, ' + (v / 255) + ')';
        c.textContent = v;
        c.onclick = () => {
            map[i] = (map[i] + 15) % 256;
            renderMapas();
        };
        m.appendChild(c);
    });
}

function guardar() {
    localStorage.setItem('motoecu', JSON.stringify(map));
    alert('✅ Guardado');
}

function flash() {
    if (!con) { alert('❌ Conecta primero'); return; }
    if (confirm('⚠️ ¿Flashear?')) alert('✅ Flasheado');
}

renderMapas();
</script>

</body>
</html>
